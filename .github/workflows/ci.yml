name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: print2medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The npm `packageManager` pins, as the Publish workflow uses. Node 22
      # ships npm 10, which resolves peer dependencies differently from the
      # npm 11 that writes the lockfile: Medusa 2.22's cva peer
      # (typescript >= 6) makes npm 10 reject it in `npm ci`. CI has to check
      # with the npm a release is built with.
      - name: Install the pinned npm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run test
      # Integration tests exercise real SQL: the unique index that absorbs
      # Printful redeliveries, and the filter operators typecheck cannot verify.
      - run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/print2medusa_test
      - run: npm run build
